name: Public Windows release
on:
  push:
    tags: ['public-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_public_release.py
      - run: python -m pytest -q -p no:cacheprovider
      - run: ./scripts/build-windows.ps1 -Python python
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/public/RailNomad -DestinationPath dist/RailNomad-public-windows-x64.zip
          $digest=(Get-FileHash dist/RailNomad-public-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  RailNomad-public-windows-x64.zip" | Set-Content dist/RailNomad-public-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: public-windows
          path: |
            dist/RailNomad-public-windows-x64.zip
            dist/RailNomad-public-windows-x64.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/RailNomad-public-windows-x64.zip dist/RailNomad-public-windows-x64.zip.sha256 --title "$env:GITHUB_REF_NAME" --generate-notes
