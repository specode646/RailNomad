name: Verify published Windows binary
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published public release tag
        required: true
        default: public-v0.4.11.1
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download and verify published archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --dir dist/downloaded --pattern '*.zip' --pattern '*.sha256'
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $archives=@(Get-ChildItem -LiteralPath dist/downloaded -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one public archive' }
          $archive=$archives[0]
          $expected=(Get-Content -LiteralPath ($archive.FullName+'.sha256') -Raw).Trim().Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) {throw 'Release checksum mismatch'}
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/downloaded/unpacked
      - name: Run actual distributed application
        run: python scripts/verify_public_desktop.py --exe dist/downloaded/unpacked/RailNomad/RailNomad.exe
      - uses: actions/upload-artifact@v4
        with:
          name: distributed-binary-verification
          path: |
            dist/verification/desktop-acceptance.json
            dist/verification/desktop-public-help.png
            dist/verification/desktop-public-results.png
